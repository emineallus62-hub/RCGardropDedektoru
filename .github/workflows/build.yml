name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q RCGardropDedektoru_Shizuku_v1.9_test_hazir_proje-1.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> extracted/RCGardropDedektoru/gradle.properties
          echo "android.enableJetifier=true" >> extracted/RCGardropDedektoru/gradle.properties
      - name: Build APK
        working-directory: extracted/RCGardropDedektoru
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Gardrop-Dedektoru-APK
          path: extracted/RCGardropDedektoru/app/build/outputs/apk/debug/app-debug.apk
